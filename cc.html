<style>
/* Layout: header → needs-me tiles → KPI strip → [network or money flow | agent card + live feed] → ask → business pulse → back office */
:root{
  --bg:#f3f4ee; --surface:#ffffff; --surface-2:#eaece2; --line:#d8dbcc; --fg:#272922; --muted:#686a5c;
  --moss:#58604a; --moss-ink:#ffffff; --sage:#b1b599; --blush:#fabeb4; --blush-ink:#a9473a;
  --ok:#5a8a2a; --warn:#b97f0c; --fail:#b32024; --idle:#96988a;
  --root:#a4a98a; --edge:#d9dccd;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4;
  --shadow:0 1px 2px rgba(39,41,34,.06),0 8px 24px rgba(39,41,34,.06);
  --f-display:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13160f; --surface:#1c2018; --surface-2:#252a20; --line:#323828; --fg:#eaecdf; --muted:#a3a593;
  --moss:#7d8763; --moss-ink:#ffffff; --sage:#7f8568; --blush:#f2b0a5; --blush-ink:#f2b0a5;
  --ok:#8cc04a; --warn:#e3b23e; --fail:#ec5f55; --idle:#787b6c; --root:#5f664f; --edge:#30362a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13160f; --surface:#1c2018; --surface-2:#252a20; --line:#323828; --fg:#eaecdf; --muted:#a3a593;
  --moss:#7d8763; --moss-ink:#ffffff; --sage:#7f8568; --blush:#f2b0a5; --blush-ink:#f2b0a5;
  --ok:#8cc04a; --warn:#e3b23e; --fail:#ec5f55; --idle:#787b6c; --root:#5f664f; --edge:#30362a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:20px max(16px,env(safe-area-inset-left,0px)) 48px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.side-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
:focus-visible{outline:2px solid var(--blush-ink);outline-offset:2px}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:14px}
.logo{height:26px;width:auto;display:block}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
h1{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;line-height:1.1;padding-left:14px;border-left:1px solid var(--line)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--surface)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}
.live.stale i{background:var(--warn);animation:none}
@keyframes blink{50%{opacity:.25}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;font-size:17px;color:var(--muted)}
.iconbtn:hover{color:var(--fg)}

/* needs-me tiles */
.needs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.need{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--shadow);position:relative}
.need .ni{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--surface-2);color:var(--st)}
.need[data-tone="fail"]{--st:var(--fail);border-color:color-mix(in srgb,var(--fail) 45%,var(--line))}
.need[data-tone="warn"]{--st:var(--warn)}
.need[data-tone="ok"]{--st:var(--ok)}
.need b{display:block;font-weight:600;line-height:1.3}
.need small{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.need .go{font-size:12px;font-weight:600;color:var(--moss);margin-top:6px;display:inline-flex;gap:4px;align-items:center}
.need[aria-pressed="true"]{outline:2px solid var(--moss);outline-offset:-1px}
.need.calm{cursor:default;--st:var(--ok)}
.nd{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.nd-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nd-h b{font-family:var(--f-display);font-weight:600;font-size:16px}
.nd-h small{display:block;color:var(--muted);font-size:13px}
.nd-acts{display:flex;gap:8px;align-items:center}
.nd ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.nd li{display:flex;gap:8px;align-items:stretch}
.nd .nd-main{flex:1;min-width:0;display:block;padding:10px 12px;border-radius:12px;background:var(--surface-2);color:inherit;text-decoration:none}
.nd a.nd-main:hover{outline:1px solid var(--line)}
.nd-x{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.nd-x:hover{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 45%,var(--line))}
.nd details{font-size:13px;color:var(--muted)}.nd details li{margin-top:6px}.nd details .nd-main{opacity:.7}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;z-index:50;box-shadow:var(--shadow)}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.nd li span{font-size:14px;font-weight:500}.nd li small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.nd .go{font-size:12px;font-weight:600;color:var(--moss)}
.nd-idea{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.nd-idea textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:80px;resize:vertical}
.nd-ok{font-size:13px;font-weight:600;color:var(--ok)}.nd-err{font-size:13px;color:var(--fail)}
a.btn{text-decoration:none}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.kpi{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:1px;border:0;text-align:left;cursor:pointer;min-width:0}
.kpi:hover{background:var(--surface-2)}
.kpi[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 -3px 0 var(--moss)}
.kpi .lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.kpi .val{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.25}
.kpi .note{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi[data-tone="fail"] .val{color:var(--fail)}
.kpi[data-tone="warn"] .val{color:var(--warn)}
.kpi[data-tone="ok"] .val{color:var(--ok)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.leftcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.stage{overflow:hidden}
.stage-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 0;flex-wrap:wrap}
.stage-h h2{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--st)}
.canvas{overflow-x:auto;padding:4px 8px 8px}
.canvas svg{display:block;width:100%;min-width:760px;height:auto}
.sidecol{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}

/* network */
.root{fill:none;stroke:var(--root);stroke-width:1.8;stroke-linecap:round}
.root.fail{stroke:var(--fail);stroke-dasharray:4 5}
.root-flow{fill:none;stroke:var(--moss);stroke-width:1.6;stroke-dasharray:1.5 9;stroke-linecap:round;opacity:.5;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-21}}
.sysedge{fill:none;stroke:var(--edge);stroke-width:1.1}
.sysedge.hl,.root.hl{stroke:var(--blush-ink);stroke-width:2}
.agent{cursor:pointer}
.agent .moss{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
.agent[data-st="ok"]{--st:var(--ok)}.agent[data-st="warn"]{--st:var(--warn)}.agent[data-st="fail"]{--st:var(--fail)}.agent[data-st="idle"]{--st:var(--idle)}
.agent .moss circle{fill:var(--st)}
.agent .disc{fill:var(--surface);stroke:var(--st);stroke-width:2}
.agent .glyph{color:var(--st)}
.agent text{font-size:10.5px;fill:var(--fg);font-weight:500}
.agent .cnt{font-size:9.5px;fill:var(--muted);font-family:var(--f-mono)}
.agent .halo{fill:none;stroke:var(--st);stroke-width:2;opacity:0}
.agent[data-st="fail"] .halo{animation:halo 1.8s ease-out infinite}
.agent.ping .halo{animation:halo .9s ease-out 1}
@keyframes halo{0%{opacity:.8;r:20}100%{opacity:0;r:40}}
.agent.sel .disc{stroke-width:3.5}
.agent.dim,.sys.dim{opacity:.22}
.sys circle{fill:var(--surface-2);stroke:var(--line)}
.sys .glyph{color:var(--muted)}
.sys text{font-size:11px;fill:var(--muted);font-weight:500}
.sys.ping circle{fill:var(--blush);stroke:var(--blush-ink)}
.sys.ping .glyph{color:var(--blush-ink)}
.mini rect{fill:var(--moss)}
.mini text{fill:var(--moss-ink)}
.mini .ring{fill:none;stroke:var(--moss);opacity:.4;transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.35);opacity:0}}
.areatag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;fill:var(--muted);text-transform:uppercase}

/* money flow */
.band{fill:none;stroke-linecap:butt;opacity:.32;transition:opacity .2s}
.band.hl{opacity:.75}.band.fade{opacity:.08}
.cnode rect{fill:var(--surface);stroke:var(--line)}
.cnode{cursor:pointer}
.cnode .l{font-size:12.5px;font-weight:600;fill:var(--fg)}
.cnode .v{font-size:11px;fill:var(--muted)}
.cnode.mid rect{stroke:var(--st,var(--line));stroke-width:1.5}
.cnode[data-st="ok"]{--st:var(--ok)}.cnode[data-st="warn"]{--st:var(--warn)}.cnode[data-st="fail"]{--st:var(--fail)}.cnode[data-st="idle"]{--st:var(--idle)}
.cnode.mid .glyph{color:var(--st)}
.cnode .glyph{color:var(--muted)}
.cnode.ping rect{fill:var(--surface-2)}
.colh{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;fill:var(--muted);text-transform:uppercase}

/* side card */
.card-h{display:flex;gap:12px;align-items:center}
.badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--surface-2);color:var(--moss);flex:none}
.card-h h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2}
.card-h small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);align-self:flex-start}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--st,var(--ok))}
[data-st="ok"]{--st:var(--ok)}[data-st="warn"]{--st:var(--warn)}[data-st="fail"]{--st:var(--fail)}[data-st="idle"]{--st:var(--idle)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat b{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.spark{width:100%;height:56px;display:block}
.spark rect{fill:var(--sage)}
.spark rect.last{fill:var(--moss)}
.spark rect:hover{fill:var(--blush-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:0;cursor:default}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--st,var(--idle))}
.jobs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.jobs li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px}
.jobs li i{width:8px;height:8px;border-radius:50%;background:var(--st);margin-top:6px}
.jobs li small{grid-column:2;color:var(--muted);font-size:12px}
.jobs li.fx{grid-template-columns:auto 1fr auto}
.jobs li.fx small,.jobs li.fx .fxs{grid-column:2/-1}
.fixbtn{grid-column:3;grid-row:1;align-self:start;border:1px solid var(--moss);background:var(--moss);color:var(--moss-ink);border-radius:10px;padding:3px 12px;cursor:pointer;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.fixbtn:hover{filter:brightness(1.08)}
.fixbtn:disabled{opacity:.55;cursor:default}
.nd .fixbtn{align-self:stretch;padding:0 14px}
.fxs{font-size:12px;line-height:1.4;padding:6px 9px;border-radius:9px;background:var(--surface-2);margin-top:2px}
.nd .fxs{background:var(--surface);margin-top:6px}
.fxs[data-f="fixed"],.fxs[data-f="ok"]{color:var(--ok)}
.fxs[data-f="failed"]{color:var(--fail)}
.fxs[data-f="needs_you"],.fxs[data-f="waiting"]{color:var(--warn)}
.fxs[data-f="busy"]{color:var(--fg)}
.fxs em{font-style:normal;color:var(--muted);display:block}
.why{font-size:12px;color:var(--muted);grid-column:2/-1}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}

/* feed */
.feedpanel{display:flex;flex-direction:column;overflow:hidden}
.feedpanel .side-h{padding:16px 18px 0}
.feed{list-style:none;margin:0;padding:6px 10px 12px;overflow-y:auto;height:600px;overscroll-behavior:contain}
.feed li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px;border-radius:12px;cursor:pointer;align-items:start}
.feed li:hover{background:var(--surface-2)}
.feed .ti{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--st);font-size:15px}
.feed li[data-o="ok"]{--st:var(--ok)}.feed li[data-o="warn"]{--st:var(--warn)}.feed li[data-o="fail"]{--st:var(--fail)}
.feed .tx{font-size:13px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.feed .tx b{font-weight:600}
.feed time{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-top:2px}
.feed li.new{animation:newrow 2.4s ease}
@keyframes newrow{0%{background:color-mix(in srgb,var(--blush) 55%,transparent)}100%{background:transparent}}
.feed li.open{background:var(--surface-2)}
.fdet{grid-column:1/-1;margin:6px 0 2px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:6px;cursor:default}
.fdet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.fdet dt{color:var(--muted);font-size:12px;padding-top:1px}
.fdet dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.fdet .quote{border-left:3px solid var(--sage);padding:2px 0 2px 10px}
.fdet .acts{display:flex;gap:8px;flex-wrap:wrap}
.fdet a{color:var(--moss);font-weight:600;font-size:12px}
.fdet button{border:0;background:none;color:var(--moss);font-weight:600;font-size:12px;cursor:pointer;padding:0}
.feed .empty{color:var(--muted);font-size:13px;padding:12px 8px;cursor:default}

/* ask */
.ask{padding:18px;display:flex;flex-direction:column;gap:12px}
.ask-h{display:flex;align-items:center;gap:10px}
.ask-h h2{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
.summary{font-size:14px;line-height:1.55;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.summary b{font-weight:600}
.askform{display:flex;gap:8px}
.askform input{flex:1;min-width:0;font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.qchips button:hover{color:var(--fg);border-color:var(--moss)}
.thread{display:flex;flex-direction:column;gap:10px}
.qa{border-top:1px solid var(--line);padding-top:10px}
.qa .q{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.qa .a{font-size:14px;white-space:pre-wrap;margin-top:4px;line-height:1.55}
.qa .a.err{color:var(--fail)}
.qa .meta{font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-top:4px}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* pulse */
/* team view (Lucas only: scorecards for Aidan, Keshav, Thiago) */
.team{display:flex;flex-direction:column;gap:16px}
.tm-top{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px}
.tm-top .big{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15}
.tm-top .sub,.tm-note{font-size:13px;color:var(--muted)}
.tm-top ol{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.tm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.tm-card{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;border-top:4px solid var(--pc)}
.tm-h{display:flex;align-items:center;gap:12px}
.tm-av{width:40px;height:40px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:17px;flex:none}
.tm-h h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2}
.tm-h small{color:var(--muted);font-size:13px}
.tm-pill{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--st);white-space:nowrap}
.team [data-st="good"]{--st:var(--ok)}.team [data-st="warn"]{--st:var(--warn)}.team [data-st="bad"]{--st:var(--fail)}.team [data-st="nodata"],.team [data-st="neutral"]{--st:var(--muted)}
.tm-targets{display:flex;flex-wrap:wrap;gap:6px}
.tm-targets span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tm-targets b{color:var(--fg);font-weight:600}
.tm-ms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tm-m{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0;color:inherit;text-decoration:none}
a.tm-m:hover{background:var(--surface-2)}
.tm-m:last-child:nth-child(odd){grid-column:1/-1}
.tm-m .lab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-m .val{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.25;color:var(--st);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tm-m[data-st="neutral"] .val{color:var(--fg)}
.tm-m[data-st="nodata"] .val{font-size:15px}
.tm-m .tr{font-family:var(--f-body);font-size:12px;font-weight:600}
.tm-m .tr.good{color:var(--ok)}.tm-m .tr.bad{color:var(--fail)}.tm-m .tr.flat{color:var(--muted)}
.tm-m .note{font-size:12px;color:var(--muted);line-height:1.35}
.tm-m .tgt{font-size:11px;color:var(--muted)}
.tm-l h4{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--st);display:flex;gap:6px;align-items:center}
.tm-l ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.tm-wait{display:flex;flex-direction:column;gap:4px}
.tm-wait a{font-size:13px;color:var(--fg);text-decoration:none;display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:10px;background:var(--surface-2)}
.tm-wait a:hover{outline:1px solid var(--line)}
.tm-wait a span:last-child{color:var(--muted);white-space:nowrap}
.tm-card details{font-size:14px}
.tm-card summary{cursor:pointer;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tm-fb{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.tm-fb .seg button{font-size:13px;padding:5px 10px}
.tm-fb input,.tm-fb textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.tm-fb textarea{min-height:260px;resize:vertical;line-height:1.5}
.tm-fb .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tm-fb .to{font-size:12.5px;color:var(--muted)}
.tm-fb .msg{font-size:13px}.tm-fb .msg.err{color:var(--fail)}
.btn.danger{background:var(--fail);color:#fff;border-color:var(--fail)}
.tm-shout{font-size:13px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--pc) 14%,var(--surface));}
@media (max-width:760px){.tm-top{grid-template-columns:1fr}.tm-grid{grid-template-columns:1fr}}
.pulse{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.pc{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pc .big{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15}
.pc .sub{font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:84px;margin-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;min-width:0}
.bars span.b{width:100%;background:var(--sage);border-radius:4px 4px 0 0;min-height:3px}
.bars div.last span.b{background:var(--moss)}
.bars div:hover span.b{background:var(--blush-ink)}
.bars small{font-size:10px;color:var(--muted)}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.track span{display:block;height:100%;border-radius:4px;background:var(--st)}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.goal{font-size:11px;color:var(--muted)}
.list{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.list li{display:flex;justify-content:space-between;gap:10px}
.list li span:last-child{color:var(--muted);white-space:nowrap}

/* back office + where */
.foot{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.where{width:100%;border-collapse:collapse;font-size:13px}
.where td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.where td:first-child{color:var(--muted);padding-right:12px;width:45%}
.where a{color:var(--moss);font-weight:600}
.warnings{font-size:12px;color:var(--muted)}

/* tooltip + login */
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:20;white-space:nowrap}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:30;padding:16px}
#login form{width:min(360px,100%);padding:28px;display:flex;flex-direction:column;gap:14px}
#login input{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#login .err{color:var(--fail);font-size:13px;min-height:1em;margin:0}
.alist{display:none}

  h1{font-size:17px}

<body>

alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
sprout:'<path d="M12 21v-9"/><path d="M12 12c0-4-3-6-7-6 0 4 3 6 7 6zM12 10c0-3.5 2.5-6 7-6 0 4-3 6-7 6z"/>',
truck:'<path d="M2 6h12v10H2zM14 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
check:'<path d="M5 12l5 5 9-10"/>',
spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>'
};
const ico=(n,cls='ico')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]||I.spark}</svg>`;
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function glyph(parent,name,x,y,size,cls='glyph'){const g=el('g',{class:cls,transform:`translate(${x-size/2},${y-size/2}) scale(${size/24})`},parent);g.innerHTML=`<g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[name]||I.spark}</g>`;return g}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const money=v=>v==null?'–':(Math.abs(v)>=10000?'$'+(v/1000).toFixed(1)+'k':'$'+Math.round(v).toLocaleString());
const ago=t=>{if(!t)return 'never';const s=(Date.now()-(typeof t==='number'?t*1000:Date.parse(t)))/1000;if(s<60)return 'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago'};
const clock=t=>new Date(t*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const stLabel={ok:'Healthy',warn:'Watch',fail:'Failing',idle:'Waiting for schedule'};
const AREA_ORDER=['Sales','Finance','Marketing','Social','Store','Team','Personal'];
const tip=$('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.textContent=t.dataset.tip;tip.style.opacity=1;const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+12)+'px';tip.style.top=(e.clientY-34)+'px'});

let S=null,view='net',sel=null,filter=null,needSel=null;const seen=new Set();let firstLoad=true;
const BY={};

/* ---------- particles ---------- */
const P=[];
function travel(path,color,dur=900,r=4.5){if(REDUCED||!path||!path.isConnected)return Promise.resolve();return new Promise(res=>{const c=el('circle',{r,fill:color},path.ownerSVGElement.querySelector('.particles'));P.push({c,path,len:path.getTotalLength(),start:performance.now(),dur,res})})}
(function loop(now){for(let k=P.length-1;k>=0;k--){const p=P[k];let t=(now-p.start)/p.dur;if(t>=1){p.c.remove();P.splice(k,1);p.res();continue}t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const pt=p.path.getPointAtLength(p.len*t);p.c.setAttribute('cx',pt.x);p.c.setAttribute('cy',pt.y)}requestAnimationFrame(loop)})(performance.now());
const outColor=o=>o==='fail'?'var(--fail)':o==='warn'?'var(--warn)':'var(--ok)';

/* ---------- network (A) ---------- */
const NET={nodes:{},roots:{},sedges:{},snodes:{},key:''};
function buildNet(){
  const svg=$('net');svg.innerHTML='';const cx=500,cy=365;
  const gE=el('g',{},svg),gR=el('g',{},svg),gP=el('g',{class:'particles'},svg),gN=el('g',{},svg);
  const A=[...S.nodes].sort((a,b)=>AREA_ORDER.indexOf(a.area)-AREA_ORDER.indexOf(b.area));const N=A.length;
  const pos={};A.forEach((a,k)=>{const ang=-Math.PI/2+(k+.5)*2*Math.PI/N;pos[a.id]={x:cx+268*Math.cos(ang),y:cy+236*Math.sin(ang),ang}});
  const used=Object.keys(S.systems).filter(s=>A.some(a=>a.sys.includes(s)));
  const sang={};used.forEach(s=>{let sx=0,sy=0;A.filter(a=>a.sys.includes(s)).forEach(a=>{sx+=Math.cos(pos[a.id].ang);sy+=Math.sin(pos[a.id].ang)});sang[s]=Math.atan2(sy,sx)});
  const order=used.sort((p,q)=>sang[p]-sang[q]);const gap=2*Math.PI/Math.max(order.length+2,12);
  for(let it=0;it<80;it++){for(let k=0;k<order.length;k++){const p=order[k],q=order[(k+1)%order.length];let d=sang[q]-sang[p];if(k===order.length-1)d+=2*Math.PI;if(d<gap){const f=(gap-d)/2;sang[p]-=f;sang[q]+=f}}}
  const spos={};order.forEach(s=>spos[s]={x:cx+440*Math.cos(sang[s]),y:cy+318*Math.sin(sang[s])});
  NET.nodes={};NET.roots={};NET.sedges={};NET.snodes={};
  A.forEach((a,k)=>{const p=pos[a.id];const mx=(cx+p.x)/2,my=(cy+p.y)/2;const sg=k%2?1:-1;const nx=-(p.y-cy),ny=p.x-cx;const L=Math.hypot(nx,ny);const d=`M${cx},${cy}Q${mx+sg*nx/L*34},${my+sg*ny/L*34} ${p.x},${p.y}`;
    NET.roots[a.id]=el('path',{d,class:'root'},gR);el('path',{d,class:'root-flow','data-id':a.id},gR);
    a.sys.forEach(s=>{const q=spos[s];if(!q)return;const mx2=(p.x+q.x)/2,my2=(p.y+q.y)/2;const kx=cx+(mx2-cx)*1.14,ky=cy+(my2-cy)*1.14;NET.sedges[a.id+'|'+s]=el('path',{d:`M${p.x},${p.y}Q${kx},${ky} ${q.x},${q.y}`,class:'sysedge'},gE)})});
  const areas={};A.forEach(a=>(areas[a.area]=areas[a.area]||[]).push(pos[a.id].ang));
  Object.entries(areas).forEach(([ar,angs])=>{const m=Math.atan2(angs.reduce((s,x)=>s+Math.sin(x),0),angs.reduce((s,x)=>s+Math.cos(x),0));const t=el('text',{x:cx+150*Math.cos(m),y:cy+128*Math.sin(m)+3,'text-anchor':'middle',class:'areatag'},gN);t.textContent=ar});
  order.forEach(s=>{const q=spos[s];const g=el('g',{class:'sys',transform:`translate(${q.x},${q.y})`},gN);el('circle',{r:21},g);glyph(g,S.systems[s].icon,0,0,18);const t=el('text',{y:36,'text-anchor':'middle'},g);t.textContent=S.systems[s].name;NET.snodes[s]=g});
  const mini=el('g',{class:'mini',transform:`translate(${cx},${cy})`},gN);el('rect',{class:'ring',x:-84,y:-36,width:168,height:72,rx:18},mini);el('rect',{x:-84,y:-36,width:168,height:72,rx:18},mini);
  const mg=glyph(mini,'server',-56,0,22,'');mg.style.color='var(--moss-ink)';
  const t1=el('text',{x:-38,y:-4,'font-size':14,'font-weight':600,'font-family':'var(--f-display)'},mini);t1.textContent='Mac mini';
  NET.miniSub=el('text',{x:-38,y:14,'font-size':10.5,opacity:.85},mini);
  const split=n=>{if(n.length<=12)return[n];const w=n.split(' ');let a='',b='';w.forEach(x=>{if(!b&&(a+' '+x).trim().length<=12)a=(a+' '+x).trim();else b=(b+' '+x).trim()});return b?[a,b]:[a]};
  A.forEach(a=>{const p=pos[a.id];const g=el('g',{class:'agent',transform:`translate(${p.x},${p.y})`,tabindex:0,role:'button'},gN);
    el('circle',{class:'halo',r:20},g);const m=el('g',{class:'moss'},g);m.style.animationDelay=(-rnd()*4).toFixed(2)+'s';
    for(let k=0;k<9;k++){const an=k/9*Math.PI*2+rnd();const rr=12+rnd()*6;el('circle',{cx:(Math.cos(an)*rr).toFixed(1),cy:(Math.sin(an)*rr).toFixed(1),r:(5+rnd()*5).toFixed(1),opacity:(.3+rnd()*.45).toFixed(2)},m)}
    el('circle',{class:'disc',r:16},g);glyph(g,a.icon,0,0,17);
    const tx=el('text',{y:38,'text-anchor':'middle'},g);const lines=split(a.name);lines.forEach((ln,j)=>{const ts=el('tspan',{x:0,dy:j?12:0},tx);ts.textContent=ln});
    el('text',{class:'cnt',y:38+lines.length*12,'text-anchor':'middle'},g);
    NET.nodes[a.id]=g;g.addEventListener('click',()=>select(sel===a.id?null:a.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(sel===a.id?null:a.id)}})});
}
function paintNet(){
  S.nodes.forEach(a=>{const g=NET.nodes[a.id];if(!g)return;g.dataset.st=a.status;g.setAttribute('aria-label',`${a.name}, ${stLabel[a.status]}, ${a.actionsToday} actions today`);
    g.querySelector('.cnt').textContent=a.actionsToday?`${a.actionsToday} today`:'';NET.roots[a.id].classList.toggle('fail',a.status==='fail');
    const f=$('net').querySelector(`.root-flow[data-id="${a.id}"]`);if(f)f.style.display=a.status==='fail'?'none':''});
  const healthy=S.nodes.filter(a=>a.status!=='fail').length;NET.miniSub.textContent=`${S.nodes.length} agents · ${healthy} healthy`;
  applyHighlight();
}
function pulseNet(e){const g=NET.nodes[e.node];if(!g)return;g.classList.remove('ping');void g.getBBox();g.classList.add('ping');
  travel(NET.roots[e.node],'var(--blush-ink)',850,4).then(()=>{const p=NET.sedges[e.node+'|'+e.sys]||Object.entries(NET.sedges).find(([k])=>k.startsWith(e.node+'|'))?.[1];if(!p)return;
    travel(p,outColor(e.out),850,4.5).then(()=>{const s=Object.entries(NET.sedges).find(([,v])=>v===p)[0].split('|')[1];const sn=NET.snodes[s];if(sn){sn.classList.add('ping');setTimeout(()=>sn.classList.remove('ping'),700)}})})}

/* ---------- money flow (C) ---------- */
const FL={bands:[],nodes:{},key:''};
function buildFlow(){
  const svg=$('flow');svg.innerHTML='';const F=S.flow;const gB=el('g',{},svg),gP=el('g',{class:'particles'},svg),gN=el('g',{},svg);
  const top=44,bottom=548;const act=id=>(BY[id]?.actions7d||0);
  const wAgent=id=>3+Math.min(26,Math.log2(1+act(id))*3.2);
  const links=F.links.filter(([c,a])=>BY[a]),outs=F.outs.filter(([a])=>BY[a]);
  const lw={};links.forEach(([c,a])=>{const n=links.filter(l=>l[1]===a).length;lw[c+'>'+a]=wAgent(a)/n});
  const ow={};outs.forEach(([a,r])=>{const n=outs.filter(l=>l[0]===a).length;ow[a+'>'+r]=wAgent(a)/n});
  const L=F.channels.map((c,i)=>({...c,col:`--c${i+1}`,kind:'l'})),M=F.agents.map(id=>({id,name:BY[id].name,icon:BY[id].icon,a:BY[id],kind:'mid'})),R=F.results.map(r=>({...r,kind:'r'}));
  const hOf=(n,k)=>Math.max(46,k==='l'?links.filter(l=>l[0]===n.id).reduce((s,l)=>s+lw[l[0]+'>'+l[1]],0)+16:k==='mid'?wAgent(n.id)+16:outs.filter(l=>l[1]===n.id).reduce((s,l)=>s+ow[l[0]+'>'+l[1]],0)+16);
  function layout(list,x,w,k){const hs=list.map(n=>hOf(n,k));const tot=hs.reduce((s,h)=>s+h,0);const g=(bottom-top-tot)/Math.max(1,list.length-1);let y=top;list.forEach((n,i)=>{n.x=x;n.w=w;n.y=y;n.h=hs[i];y+=hs[i]+g})}

setInterval(()=>{if(!document.hidden)load()},20000);setInterval(()=>setLive(),15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});

/* ---------- view + theme ---------- */
function setView(v){view=v;['net','flow','team'].forEach(k=>$('v-'+k).setAttribute('aria-pressed',v===k));$('net').toggleAttribute('hidden',v!=='net');$('flow').toggleAttribute('hidden',v!=='flow');
  $('mainwrap').toggleAttribute('hidden',v==='team');$('pulse').toggleAttribute('hidden',v==='team');$('team').toggleAttribute('hidden',v!=='team');if(v==='team'&&S)renderTeam();
  if(v!=='team')$('stage-title').textContent=v==='net'?'How everything connects':'Which agents move revenue';try{localStorage.setItem('cc-view',v)}catch(_){}}
$('v-net').onclick=()=>setView('net');$('v-flow').onclick=()=>setView('flow');$('v-team').onclick=()=>setView('team');
try{const v=localStorage.getItem('cc-view');if(v==='flow'||v==='team')setView(v);const t=localStorage.getItem('cc-theme');if(t)document.documentElement.dataset.theme=t}catch(_){}
$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const t=dark?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('cc-theme',t)}catch(_){}};
load();
</script>
</body>
</html>
